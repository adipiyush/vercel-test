<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Test Deployment</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0a0a0a;
      color: #ffffff;
    }
    .card {
      text-align: center;
      padding: 2.5rem;
      border: 1px solid #333333;
      border-radius: 12px;
      background-color: #111111;
      max-width: 400px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #0070f3;
    }
    p {
      color: #888888;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.25rem 0.75rem;
      background-color: #0070f322;
      color: #50e3c2;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Vercel Test Page</h1>
    <p>Your repository is successfully connected and deployed!</p>
    <div class="badge">Status: Live</div>
  </div>
</body>
</html>
